<!DOCTYPE html>
<html lang="es" class="h-full bg-[#0B0F19] text-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión | Norton Family SaaS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Outfit:wght@600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { font-family: 'Inter', sans-serif; }
    .font-display { font-family: 'Outfit', sans-serif; }
  </style>
</head>
<body class="min-h-full flex flex-col justify-center py-12 sm:px-6 lg:px-8 bg-[#0B0F19] text-slate-100">

  <div class="sm:mx-auto sm:w-full sm:max-w-md text-center px-4">
    <!-- Brand Logo -->
    <div class="w-14 h-14 rounded-2xl bg-[#FFB800] text-black flex items-center justify-center shadow-xl shadow-amber-500/20 mx-auto mb-4 font-black">
      <svg class="w-8 h-8 fill-current text-black" viewBox="0 0 24 24">
        <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm-2 16l-4-4 1.41-1.41L10 14.17l6.59-6.59L18 9l-8 8z"/>
      </svg>
    </div>
    <h2 class="text-2xl sm:text-3xl font-display font-black text-white tracking-tight">
      Norton <span class="text-[#FFB800]">Family</span>
    </h2>
    <p class="mt-1 text-xs sm:text-sm text-slate-400">
      Plataforma de Control Parental y Cuidado Familiar
    </p>
  </div>

  <div class="mt-8 sm:mx-auto sm:w-full sm:max-w-md px-4">
    <div class="bg-[#161F30] py-8 px-6 sm:px-10 shadow-2xl rounded-3xl border border-[#283548] space-y-6">
      
      <!-- Error / Alert Banner -->
      <div id="loginAlert" class="hidden p-3.5 rounded-xl text-xs font-semibold flex items-center space-x-2">
        <span id="alertIcon">⚠️</span>
        <span id="alertMessage">Mensaje de error</span>
      </div>

      <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-slate-300 uppercase tracking-wider mb-1.5">
            Correo Electrónico o Usuario
          </label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
              <i data-lucide="mail" class="w-4 h-4"></i>
            </span>
            <input type="text" id="loginEmail" required placeholder="ej: padre@segurity.com"
              class="w-full pl-10 pr-3.5 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-white placeholder-slate-500 text-sm focus:outline-none focus:border-[#FFB800] focus:ring-1 focus:ring-[#FFB800] transition">
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-300 uppercase tracking-wider mb-1.5">
            Contraseña
          </label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
              <i data-lucide="lock" class="w-4 h-4"></i>
            </span>
            <input type="password" id="loginPassword" required placeholder="••••••••"
              class="w-full pl-10 pr-3.5 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-white placeholder-slate-500 text-sm focus:outline-none focus:border-[#FFB800] focus:ring-1 focus:ring-[#FFB800] transition">
          </div>
        </div>

        <button type="submit" id="btnSubmit"
          class="w-full py-3 rounded-xl bg-[#FFB800] hover:bg-[#E5A600] text-black font-extrabold text-sm shadow-lg shadow-amber-500/20 transition-all flex items-center justify-center space-x-2">
          <span>Ingresar a mi Plataforma</span>
          <i data-lucide="arrow-right" class="w-4 h-4"></i>
        </button>
      </form>

      <!-- Quick Demo Access / Presets for easy testing -->
      <div class="pt-4 border-t border-slate-800 space-y-2">
        <p class="text-[11px] text-slate-400 font-semibold text-center uppercase tracking-wider">
          Accesos Rápidos de Prueba:
        </p>
        <div class="grid grid-cols-2 gap-2 text-xs">
          <button type="button" onclick="fillCredentials('admin@segurity.com', 'admin')"
            class="p-2.5 rounded-xl bg-slate-800/80 hover:bg-slate-700 border border-slate-700 text-left transition flex flex-col">
            <span class="font-bold text-amber-300 flex items-center space-x-1">
              <span>👑 Super Admin</span>
            </span>
            <span class="text-[10px] text-slate-400 mt-0.5">Dueño / Alquileres</span>
          </button>
          
          <button type="button" onclick="fillCredentials('padre@segurity.com', 'padre')"
            class="p-2.5 rounded-xl bg-slate-800/80 hover:bg-slate-700 border border-slate-700 text-left transition flex flex-col">
            <span class="font-bold text-emerald-400 flex items-center space-x-1">
              <span>👨‍👩‍👧 Cliente Padre</span>
            </span>
            <span class="text-[10px] text-slate-400 mt-0.5">Familia Alquilada</span>
          </button>
        </div>
      </div>

    </div>

    <!-- Footer info -->
    <p class="mt-6 text-center text-xs text-slate-500">
      Sistema SaaS de Control Parental &copy; 2026. Todos los derechos reservados.
    </p>
  </div>

  <script>
    if (window.lucide) lucide.createIcons();

    function fillCredentials(email, password) {
      document.getElementById('loginEmail').value = email;
      document.getElementById('loginPassword').value = password;
    }

    async function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value.trim();
      const btn = document.getElementById('btnSubmit');
      const alertBox = document.getElementById('loginAlert');
      const alertMsg = document.getElementById('alertMessage');

      alertBox.classList.add('hidden');
      btn.disabled = true;
      btn.innerHTML = '<span>Verificando...</span>';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await res.json();

        if (res.ok && data.success) {
          localStorage.setItem('norton_token', data.token);
          localStorage.setItem('norton_user', JSON.stringify(data.user));

          if (data.user.role === 'admin') {
            window.location.href = '/admin';
          } else {
            window.location.href = '/';
          }
        } else {
          alertBox.className = 'p-3.5 rounded-xl text-xs font-semibold flex items-center space-x-2 bg-red-950/60 border border-red-500/40 text-red-300';
          alertMsg.innerText = data.error || 'Credenciales incorrectas';
          alertBox.classList.remove('hidden');
        }
      } catch (err) {
        alertBox.className = 'p-3.5 rounded-xl text-xs font-semibold flex items-center space-x-2 bg-red-950/60 border border-red-500/40 text-red-300';
        alertMsg.innerText = 'Error de conexión con el servidor.';
        alertBox.classList.remove('hidden');
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<span>Ingresar a mi Plataforma</span><i data-lucide="arrow-right" class="w-4 h-4"></i>';
        if (window.lucide) lucide.createIcons();
      }
    }
  </script>
</body>
</html>
