version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: familyguard_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-familyguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-familyguard_secret}
      POSTGRES_DB: ${POSTGRES_DB:-familyguard_v2}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-familyguard} -d ${POSTGRES_DB:-familyguard_v2}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - familyguard-internal

  redis:
    image: redis:7-alpine
    container_name: familyguard_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - familyguard-internal

  backend:
    build:
      context: ./backend
      dockerfile: ../infrastructure/docker/Dockerfile.backend
    container_name: familyguard_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: "postgresql://${POSTGRES_USER:-familyguard}:${POSTGRES_PASSWORD:-familyguard_secret}@postgres:5432/${POSTGRES_DB:-familyguard_v2}?schema=public"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-dev_jwt_secret_key_familyguard_v2_at_least_32_characters}
    ports:
      - "3000:3000"
    networks:
      - familyguard-internal

volumes:
  pgdata:
    name: familyguard_v2_pgdata
  redisdata:
    name: familyguard_v2_redisdata

networks:
  familyguard-internal:
    driver: bridge
