version: '3.8'

services:
  norton-family:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: norton-parental-app
    restart: unless-stopped
    ports:
      - "${PORT:-3080}:3080"
    environment:
      - PORT=3080
      - NODE_ENV=production
      - PUBLIC_URL=https://segurity.appzplay.online
    volumes:
      # Volumen persistente para que tus reglas, perfiles e historial se guarden siempre
      - norton_data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3080/api/data"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  norton_data:
    name: norton_family_data
